name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend Python tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 \
            libglib2.0-0 \
            poppler-utils \
            tesseract-ocr \
            tesseract-ocr-eng

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt

      - name: Run backend tests
        run: make test-backend

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Audit frontend dependencies
        run: npm audit --audit-level=high

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build

  docker:
    name: Docker compose and build smoke
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose configuration
        run: make docker-check

      - name: Build Docker image
        run: docker build .

  security:
    name: Security checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python for dependency audit
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Audit Python dependencies (informational)
        continue-on-error: true
        run: |
          python -m pip install --upgrade pip
          python -m pip install pip-audit
          pip-audit -r requirements.txt
  e2e-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: legaldocuman:ci
          cache-from: type=gha,scope=legaldocuman-rfdetr
          cache-to: type=gha,mode=max,scope=legaldocuman-rfdetr
      - run: LEGALDOCUMAN_IMAGE=legaldocuman:ci docker compose up -d --no-build --wait
      - name: Migration round-trip
        run: |
          docker compose exec -T app flask --app run.py db downgrade 0006_document_relationships
          docker compose exec -T app flask --app run.py db upgrade
      - run: >-
          docker compose exec -T
          -e RUN_REAL_E2E=1
          -e E2E_BASE_URL=http://localhost:5000
          -e E2E_API_KEY=change-me-in-production
          app pytest -q tests/e2e/test_real_pipeline.py
      - if: always()
        run: mkdir -p artifacts && docker compose logs --no-color > artifacts/docker.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-smoke-logs
          path: artifacts
      - if: always()
        run: docker compose down -v
